<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Askel · Suomen kurssi</title>
<meta name="description" content="Askel — an interactive Finnish course in four modules that follows the Suomen mestari 1–4 syllabus. Grammar, vocabulary, texts, auto-graded exercises and YKI practice.">
<meta name="theme-color" content="#1E4D44">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='20' width='8' height='9' rx='2' fill='%232C6A5D'/%3E%3Crect x='12' y='13' width='8' height='16' rx='2' fill='%231E4D44'/%3E%3Crect x='21' y='5' width='8' height='24' rx='2' fill='%23905E11'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== Askel — tokens ===== */
:root{
  --paper:#F5F2EA; --card:#FFFFFF; --card2:#FBF9F4; --line:#E3DED3; --line2:#D3CCBE;
  --ink:#152628; --ink2:#2F4346; --ink3:#555F63; --ink4:#626A6C;
  --pine:#1E4D44; --pine2:#2C6A5D; --pine-bg:#E3EEEA;
  --teal:#0F5E5A; --teal-bg:#DCEFEC; --amber:#7A4E0C; --amber-bg:#F6E7CB;
  --lingon:#A8322F; --lingon-bg:#F8E1DE; --ok:#22744A; --ok-bg:#DDF0E3;
  --cloud:#905E11; --focus:#2C6A5D;
  --shadow:0 1px 2px rgba(21,38,40,.06),0 4px 14px rgba(21,38,40,.05);
  --r:14px; --r2:10px;
  --f-d:"Fraunces",Georgia,"Times New Roman",serif;
  --f-u:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1819; --card:#152325; --card2:#182829; --line:#283A3C; --line2:#33494B;
    --ink:#E6EEEC; --ink2:#C4D1CF; --ink3:#92A6A7; --ink4:#82999A;
    --pine:#86C9BA; --pine2:#7CC4B5; --pine-bg:#1B3330;
    --teal:#8FDCD3; --teal-bg:#123634; --amber:#F0C27A; --amber-bg:#3A2C12;
    --lingon:#F29A94; --lingon-bg:#3B1E1D; --ok:#8FD6AA; --ok-bg:#16301F;
    --cloud:#E5B465; --focus:#86C9BA;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1819; --card:#152325; --card2:#182829; --line:#283A3C; --line2:#33494B;
  --ink:#E6EEEC; --ink2:#C4D1CF; --ink3:#92A6A7; --ink4:#82999A;
  --pine:#86C9BA; --pine2:#7CC4B5; --pine-bg:#1B3330;
  --teal:#8FDCD3; --teal-bg:#123634; --amber:#F0C27A; --amber-bg:#3A2C12;
  --lingon:#F29A94; --lingon-bg:#3B1E1D; --ok:#8FD6AA; --ok-bg:#16301F;
  --cloud:#E5B465; --focus:#86C9BA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}

/* ===== base ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-u);min-height:100vh;overflow-x:hidden}
a{color:var(--pine2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-d);font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0;overflow-wrap:break-word;hyphens:auto}
.chs>*,.mods>*,.grid>*,.secgrid>*,.dl>*{min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink3)}
.en{color:var(--ink3);font-size:.92em}
body.no-en .en{display:none}
body:not(.no-en) span.fi + span.en{display:block}
body:not(.no-en) .enflip .en{display:none!important}
body.no-en .enflip .en{display:block}
.mono{font-family:var(--f-m)}
.eyebrow{font:600 12px/1.2 var(--f-u);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font:600 21px/1 var(--f-d)}
.brand svg{width:26px;height:26px}
.crumb{flex:1;min-width:0;font-size:14px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:var(--ink3);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{background:var(--card);border-color:var(--line)}
.iconbtn svg{width:20px;height:20px}

/* ===== buttons & chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--pine2)}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0E1819}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0E1819}}
.btn.pri:hover{background:var(--pine2);border-color:var(--pine2)}
.btn.ghost{background:none;border-color:transparent;color:var(--pine2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--ink2);white-space:nowrap}
.tag.lvl{background:var(--pine-bg);border-color:transparent;color:var(--pine);font-weight:600}
.tag.soon{background:var(--amber-bg);border-color:transparent;color:var(--amber);font-weight:600}
.spk{display:inline-grid;place-items:center;width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--pine2);vertical-align:middle}
.spk:hover{border-color:var(--pine2)}
.spk svg{width:15px;height:15px}
.spk.on{background:var(--pine);color:var(--card);border-color:var(--pine)}

/* morphology chips */
.m{font-family:var(--f-m);font-size:.9em;padding:0 2px;margin:0;border-radius:4px;font-weight:600}
.m.c{background:var(--teal-bg);color:var(--teal)}
.m.p{background:var(--amber-bg);color:var(--amber)}
.g{color:var(--lingon);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
strong.hl{font-weight:700;color:var(--ink)}

/* ===== cards ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:14px}
@media (min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* ===== home ===== */
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(40px,9vw,68px);font-weight:600;letter-spacing:-.03em}
.hero h1 em{font-style:italic;color:var(--pine2);font-weight:500}
.hero p{max-width:600px;margin:10px 0 0;font-size:17px;color:var(--ink2)}
.cont{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-top:22px;text-decoration:none;color:inherit}
.cont .ic{width:42px;height:42px;border-radius:12px;background:var(--pine-bg);color:var(--pine);display:grid;place-items:center;flex:0 0 42px}
.cont .ic svg{width:20px;height:20px}
.cont>svg{flex:0 0 20px;width:20px;height:20px;color:var(--ink3)}
.btn svg,.prnav svg{flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{padding:12px 14px}
.stat b{display:block;font:600 24px/1.1 var(--f-d)}
.stat span{font-size:12.5px;color:var(--ink3)}
.mods{display:grid;gap:14px;margin:26px 0}
@media (min-width:720px){.mods{grid-template-columns:1fr 1fr}}
.mod{position:relative;display:block;padding:20px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-2px);border-color:var(--line2)}
.mod .num{position:absolute;right:14px;top:-6px;font:600 108px/1 var(--f-d);color:var(--line);pointer-events:none;letter-spacing:-.05em}
.mod h2{font-size:24px;position:relative}
.mod p{position:relative;margin:6px 0 14px;color:var(--ink2);font-size:15px;max-width:85%}
.mod .row{position:relative}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:14px;position:relative}
.bar i{display:block;height:100%;background:var(--pine2);border-radius:9px}
.foot{border-top:1px solid var(--line);margin-top:30px;padding:22px 0 40px;font-size:13px;color:var(--ink3)}
.foot p{margin:4px 0;max-width:720px}

/* ===== module page ===== */
.phead{padding:26px 0 8px}
.phead h1{font-size:clamp(28px,6vw,40px)}
.phead p{margin:8px 0 0;color:var(--ink2);max-width:640px}
.chs{display:grid;gap:12px;margin:20px 0 10px}
.ch{display:flex;gap:14px;align-items:flex-start;padding:16px;text-decoration:none;color:inherit}
.ch:hover{border-color:var(--line2)}
.ch .n{flex:0 0 46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--pine-bg);color:var(--pine);font:600 20px/1 var(--f-d)}
.ch .b{flex:1;min-width:0}
.ch h3{font-size:19px}
.ch .t{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch .tag{white-space:normal;max-width:100%;line-height:1.35;padding-top:3px;padding-bottom:3px}
.ring{flex:0 0 42px;width:42px;height:42px}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--pine2);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font:600 11px var(--f-u);fill:var(--ink2)}
.outline .ch{cursor:default}
.outline .ch .n{background:var(--card2);color:var(--ink3);border:1px solid var(--line)}

/* ===== chapter ===== */
.tabs{position:sticky;top:56px;z-index:15;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:6px;padding-bottom:6px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:10px;text-decoration:none;color:var(--ink3);font-weight:600;font-size:14px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--card)}
.tab.on{background:var(--pine);color:var(--card)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tab.on .dot{background:var(--card)}
.sec{padding:20px 0 30px}
.sec>h2{font-size:26px;margin-bottom:4px}
.sec>.en{margin:0 0 14px}
.goals{list-style:none;margin:0;padding:0}
.goals li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.goals li:last-child{border:0}
.goals li svg{flex:0 0 18px;width:18px;height:18px;color:var(--pine2);margin-top:3px}
.goals div>span{display:block}
.booknote{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r2);background:var(--card2);border:1px dashed var(--line2);font-size:14px;color:var(--ink2)}
.booknote svg{flex:0 0 22px;width:22px;height:22px;color:var(--cloud)}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:720px){.secgrid{grid-template-columns:repeat(4,1fr)}}
.sgo{display:flex;flex-direction:column;gap:4px;padding:14px;text-decoration:none;color:inherit;min-height:92px}
.sgo:hover{border-color:var(--pine2)}
.sgo svg{width:22px;height:22px;color:var(--pine2)}
.sgo b{font-size:15px}
.sgo span{font-size:12.5px;color:var(--ink3)}

/* dialogue */
.dlg{padding:6px 0}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start}
.ln:last-child{border-bottom:0}
.ln .who{font:600 13px/1.9 var(--f-u);color:var(--pine2);min-width:56px}
.ln .who.b{color:var(--cloud)}
.ln .who.c{color:var(--lingon)}
.ln .fi{font-size:16.5px}
.ln.narr{grid-template-columns:1fr auto}
.ln.narr .fi{font-family:var(--f-d);font-size:17.5px;line-height:1.6}
.ln.playing{background:var(--pine-bg)}

/* vocab */
.vg{margin-top:16px}
.vg h3{font:600 13px/1.2 var(--f-u);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px 4px}
.vw{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.vw:last-child{border:0}
.vw .w{grid-column:2;font-weight:600;font-size:16px}
.vw .w small{font-weight:500;color:var(--ink4);font-family:var(--f-m);font-size:12px;margin-left:6px}
.vw .e{grid-column:2;color:var(--ink3);font-size:14.5px}
.vw .spk{grid-row:1 / span 2}
.vw.known .w::after{content:"✓";color:var(--ok);margin-left:8px;font-size:13px}

/* flashcards */
.fc-wrap{max-width:520px;margin:10px auto 0}
.fc{position:relative;height:250px;perspective:1200px;cursor:pointer}
.fc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.fc .back{transform:rotateY(180deg);background:var(--card2)}
.fc .big{font:600 30px/1.2 var(--f-d)}
.fc .hint{font-size:13px;color:var(--ink4)}
.fc-meta{display:flex;justify-content:space-between;align-items:center;margin:12px 2px;font-size:14px;color:var(--ink3)}

/* grammar */
.gs{margin-top:14px;overflow:hidden}
.gs>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px}
.gs>summary::-webkit-details-marker{display:none}
.gs>summary .gi{flex:0 0 34px;height:34px;border-radius:10px;background:var(--teal-bg);color:var(--teal);display:grid;place-items:center;font:600 15px var(--f-d)}
.gs>summary h3{font-size:19px}
.gs>summary .chev{margin-left:auto;transition:transform .2s;color:var(--ink3)}
.gs[open]>summary .chev{transform:rotate(180deg)}
.gb{padding:0 18px 18px}
.gb>*+*{margin-top:12px}
.gb p{margin:0}
.gb .fi{display:block}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);-webkit-overflow-scrolling:touch;
  background:linear-gradient(to right,var(--card) 30%,transparent) left/36px 100% no-repeat local,linear-gradient(to left,var(--card) 30%,transparent) right/36px 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.22),transparent) left/12px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.22),transparent) right/12px 100% no-repeat scroll;background-color:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--card2);font-size:13px;font-weight:600;color:var(--ink2)}
th .en{display:block;font-weight:500;font-size:11.5px}
td{overflow-wrap:normal}
@media (max-width:520px){th,td{padding:7px 8px}table{font-size:14px}}
.tnote{font-size:13.5px;color:var(--ink3);margin-top:6px}
.exs{border-left:3px solid var(--line2);padding-left:12px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.ex>div{flex:1}
.ex .fi{font-size:16px}
.box{border-radius:var(--r2);padding:12px 14px;font-size:15px}
.box b.k{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.box.huom{background:var(--amber-bg)}
.box.huom b.k{color:var(--amber)}
.box.muista{background:var(--teal-bg)}
.box.muista b.k{color:var(--teal)}
.box.virhe{background:var(--lingon-bg)}
.box.virhe b.k{color:var(--lingon)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:26px;height:26px;border-radius:50%;background:var(--pine);color:var(--card);display:grid;place-items:center;font:600 13px var(--f-u)}

/* phrases */
.ph{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.ph:last-child{border:0}
.ph .fi{font-weight:600}
.ph .spk{grid-row:1 / span 2;grid-column:2}
.ph .pk{display:block;font-family:var(--f-m);font-size:13px;color:var(--cloud)}

/* drills list */
.dl{display:grid;gap:10px}
.di{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:inherit}
.di:hover{border-color:var(--pine2)}
.di .ti{flex:0 0 40px;height:40px;border-radius:11px;background:var(--pine-bg);color:var(--pine);display:grid;place-items:center}
.di .ti svg{width:20px;height:20px}
.di .b{flex:1;min-width:0}
.di b{display:block;font-size:15.5px}
.di .sc{font:600 14px var(--f-u);color:var(--ink3);white-space:nowrap}
.di .sc.good{color:var(--ok)}

/* practice */
.pr{max-width:640px;margin:0 auto;padding:18px 0 40px}
.prtop{display:flex;align-items:center;gap:12px}
.prtop .bar{flex:1;margin:0}
.prtop .cnt{font:600 14px var(--f-u);color:var(--ink3);min-width:46px;text-align:right}
.q{margin-top:18px;padding:22px 18px}
.q .instr{font-size:13.5px;color:var(--ink3);margin-bottom:12px}
.q .qt{font-size:20px;line-height:1.5}
.q .qt .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--pine2);margin:0 3px}
.hintc{display:inline-block;font-family:var(--f-m);font-size:13px;padding:1px 8px;border-radius:7px;background:var(--amber-bg);color:var(--amber);margin-left:4px;vertical-align:2px}
.ans{display:flex;gap:8px;margin-top:16px}
.ans input{flex:1;min-width:0;height:48px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card2);padding:0 14px;font:500 17px var(--f-u);color:var(--ink)}
.ans input:focus{outline:none;border-color:var(--pine2)}
.ans input.ok{border-color:var(--ok);background:var(--ok-bg)}
.ans input.bad{border-color:var(--lingon);background:var(--lingon-bg)}
.kbd{display:flex;gap:6px;margin-top:8px}
.kbd button{width:44px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-weight:600}
.opts{display:grid;gap:9px;margin-top:16px}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card2);cursor:pointer;font-size:16px}
.opt:hover:not([disabled]){border-color:var(--pine2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--lingon);background:var(--lingon-bg)}
.opt[disabled]{cursor:default}
.tf{grid-template-columns:1fr 1fr}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ink)}
.fb.ok b{color:var(--ok)}
.fb.bad{background:var(--lingon-bg)}
.fb.bad b{color:var(--lingon)}
.fb .why{display:block;margin-top:4px;color:var(--ink2)}
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px}
.built{border:1.5px dashed var(--line2);margin-top:16px}
.pool{margin-top:8px}
.tok{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font-size:16px;font-weight:500}
.tok:hover{border-color:var(--pine2)}
.tok.used{visibility:hidden}
.built .punct{align-self:flex-end;font:600 22px/1 var(--f-d);color:var(--ink3);margin-left:auto;padding:0 4px 8px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.mt .col{display:grid;gap:9px;align-content:start}
.mt button{min-height:46px;padding:8px 10px;border-radius:11px;border:1.5px solid var(--line2);background:var(--card2);cursor:pointer;font-size:15px;text-align:left}
.mt button.sel{border-color:var(--pine2);background:var(--pine-bg)}
.mt button.done{border-color:var(--ok);background:var(--ok-bg);opacity:.7;cursor:default}
.mt button.bad{border-color:var(--lingon);background:var(--lingon-bg)}
.listen{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
.listen .spk{width:64px;height:64px;flex-basis:64px}
.listen .spk svg{width:28px;height:28px}
.prnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result{text-align:center;padding:30px 18px}
.result .big{font:600 64px/1 var(--f-d);color:var(--pine2)}
.miss{text-align:left;margin-top:18px}
.miss li{margin:6px 0}

/* yki */
.yk{padding:18px}
.yk h3{font-size:19px}
.timer{font:600 40px/1 var(--f-m);text-align:center;margin:14px 0 6px;color:var(--pine2)}
.timer.speak{color:var(--lingon)}
.phase{text-align:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
textarea{width:100%;min-height:200px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card2);padding:12px 14px;font:16px/1.6 var(--f-u);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--pine2)}
.wc{font-size:13px;color:var(--ink3);text-align:right;margin-top:4px}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:4px 0}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{flex:0 0 18px;width:18px;height:18px;margin-top:3px;accent-color:var(--pine2)}
.model{white-space:pre-wrap;font-family:var(--f-d);font-size:16.5px;line-height:1.65}

/* settings + search */
.set{display:grid;gap:12px}
.seti{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 13px;border:0;background:var(--card);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink3)}
.seg button.on{background:var(--pine);color:var(--card)}
.seti input[type=range]{accent-color:var(--pine2);width:160px}
.seti select{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:0 8px;max-width:230px}
.search{width:100%;height:48px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);padding:0 14px;font:16px var(--f-u);color:var(--ink);margin-top:14px}
.search:focus{outline:none;border-color:var(--pine2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink3);margin-top:8px}
@media (max-width:420px){
  .pad{padding:15px}
  .q{padding:18px 14px}
  .q .qt{font-size:18px}
  .stats{gap:8px}
  .stat{padding:10px}
  .stat b{font-size:20px}
  .mod .num{font-size:88px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  texts: [{
    title: { fi: "Kofin päivä", en: "Kofi's day" },
    intro: { fi: "Kofi kertoo tavallisesta arkipäivästä.", en: "Kofi describes an ordinary weekday." },
    lines: [
      { fi: "Herään joka aamu kello seitsemän. Ensin käyn suihkussa, ja sitten syön aamupalaa.", en: "I wake up at seven every morning. First I take a shower and then I have breakfast." },
      { fi: "Juon kahvia ja luen uutisia puhelimesta.", en: "I drink coffee and read the news on my phone." },
      { fi: "Kello kahdeksan lähden kouluun. Menen bussilla, koska Vantaalta on pitkä matka.", en: "At eight I leave for school. I go by bus because it's a long way from Vantaa." },
      { fi: "Opiskelen tietotekniikkaa ammattikorkeakoulussa. Tunnit alkavat yhdeksältä.", en: "I study IT at a university of applied sciences. Classes start at nine." },
      { fi: "Kello kaksitoista syön lounasta koulun ravintolassa.", en: "At twelve I have lunch in the school restaurant." },
      { fi: "Iltapäivällä teen kotitehtäviä kirjastossa. Joskus tarvitsen apua, ja silloin kysyn opettajalta.", en: "In the afternoon I do homework in the library. Sometimes I need help, and then I ask the teacher." },
      { fi: "Maanantaina ja keskiviikkona menen suomen kurssille Espooseen.", en: "On Mondays and Wednesdays I go to the Finnish course in Espoo." },
      { fi: "Kotona laitan ruokaa ja kuuntelen musiikkia. Illalla soitan äidille Accraan.", en: "At home I cook and listen to music. In the evening I call my mum in Accra." },
      { fi: "Joskus pelaan jalkapalloa. Haluan nukkua hyvin, joten menen nukkumaan kello yksitoista.", en: "Sometimes I play football. I want to sleep well, so I go to bed at eleven." },
      { fi: "Mutta viikonloppuna en herää aikaisin!", en: "But at the weekend I don't wake up early!" }
    ],
    check: [

    ]
  }],

    { title: { fi: "Verbityypit 1–5: tunnista tyyppi", en: "Verb types 1–5: identify the type" }, body: [
      { p: { fi: "Infinitiivin loppu kertoo verbityypin. Tarkista nämä järjestyksessä:", en: "The ending of the infinitive tells you the type. Check in this order:" } },

        { fi: "Loppuuko -ita/-itä? → tyyppi 5: tarvita, valita.", en: "Ends in -ita/-itä? → type 5." },
        { fi: "Loppuuko vokaali + -ta/-tä (-ata, -ota, -uta, -ätä…)? → tyyppi 4: haluta, pelata, herätä.", en: "Ends in vowel + -ta/-tä? → type 4." },
        { fi: "Loppuuko kahteen vokaaliin? → tyyppi 1: puhua, lukea, kysyä.", en: "Ends in two vowels? → type 1." }
      ]},
      { box: { fi: "-eta-verbit (esim. vanheta) ovat useimmiten tyyppiä 6. Ne tulevat kirjassa 2.", en: "Verbs in -eta (e.g. vanheta) are mostly type 6 — that comes in Book 2." }, kind: "huom" }
    ]},

      { table: { head: ["", "1 · puhua", "2 · syödä", "3 · tulla", "4 · haluta", "5 · tarvita"], rows: [

      { who: "Nadia", fi: "Hyvää syntymäpäivää, Ville! Paljon onnea! Tässä on pieni lahja.", en: "Happy birthday, Ville! Congratulations! Here's a small present." },
      { who: "Ville", fi: "Kiitos paljon!", en: "Thank you so much!" },
      { who: "Nadia", fi: "Monesko syntymäpäivä tämä on?", en: "Which birthday is this?" },
      { who: "Ville", fi: "Neljäskymmenes! Olen nyt neljäkymmentä vuotta vanha.", en: "My fortieth! I'm forty years old now." },
      { who: "Ville", fi: "Ota kahvia ja kakkua. Pöydällä on myös suolaista: voileipäkakkua ja piirakkaa.", en: "Have some coffee and cake. There's savoury food on the table too: sandwich cake and pie." },
      { who: "Nadia", fi: "Kiitos. Juon mieluummin teetä. Onko teetä?", en: "Thanks. I'd rather have tea. Is there any tea?" },
      { who: "Ville", fi: "On. Termoskannu on pöydän päällä, kukkien vieressä.", en: "Yes. The thermos is on the table, next to the flowers." },
      { who: "Nadia", fi: "Mmm, kakku on tosi hyvää! Mitä siinä on?", en: "Mmm, the cake is really good! What's in it?" },
      { who: "Ville", fi: "Siinä on mansikoita ja kermaa.", en: "Strawberries and cream." },
      { who: "Nadia", fi: "Missä Kofi on? Hän ei ole vielä täällä.", en: "Where's Kofi? He isn't here yet." },
      { who: "Ville", fi: "Ehkä hän ei löydä tänne.", en: "Maybe he can't find his way here." },
      { who: "Kofi", fi: "Hei! Anteeksi, olen myöhässä! Paljon onnea, Ville!", en: "Hi! Sorry I'm late! Happy birthday, Ville!" },
      { who: "Ville", fi: "Kiitos! Istu tuolle sohvalle.", en: "Thanks! Sit down on that sofa." },
      { who: "Kofi", fi: "Monesko päivä tänään on?", en: "What's the date today?" },
      { who: "Nadia", fi: "Tänään on viides lokakuuta.", en: "Today is the fifth of October." },
      { who: "Ville", fi: "Kahvia kaikille! Kippis!", en: "Coffee for everyone! Cheers!" }
    ],

  grammar: [
    { title: { fi: "Ainesanat ja partitiivi", en: "Mass nouns and the partitive" }, body: [
      { p: { fi: "Ainesana on asia, jota ei voi laskea: kahvi, vesi, maito, leipä, raha. Kun puhut epämääräisestä määrästä, käytä partitiivia.", en: "A mass noun is something you can't count: coffee, water, milk, bread, money. For an unspecified amount, use the partitive." } },
      { ex: [["Juon kahvia.", "I drink (some) coffee."], ["Ostan maitoa.", "I'm buying (some) milk."], ["Haluatko teetä?", "Would you like (some) tea?"], ["Jääkaapissa ei ole juustoa.", "There's no cheese in the fridge."]] },
      { table: { head: [["Määrä", "Amount"], ["+ partitiivi", "+ partitive"]], rows: [
        ["kuppi", "kuppi kahvi*a*"], ["lasi", "lasi vet*tä*"], ["litra", "litra maito*a*"], ["pala", "pala kakku*a*"], ["pullo", "pullo mehu*a*"], ["vähän / paljon", "vähän sokeri*a*"]
      ]}},
      { table: { head: [["Tuttu, koko asia → nominatiivi", "The (whole) thing"], ["Epämääräinen määrä → partitiivi", "Some, any"]], rows: [
        ["==Maito== on jääkaapissa.", "Jääkaapissa on ==maitoa==."], ["==Kahvi== on pöydällä.", "Pöydällä on ==kahvia==."]
      ]}},
      { box: { fi: "Kun kuvailet ainesanaa, adjektiivi on partitiivissa: Kahvi on kuuma*a*. Kakku on hyvä*ä*. Mutta: Talo on iso (talo on laskettava asia).", en: "When you describe a mass noun, the adjective goes into the partitive: Kahvi on kuumaa. Kakku on hyvää. Countable things don't: Talo on iso." }, kind: "muista" }
    ]},
    { title: { fi: "Järjestysluvut", en: "Ordinal numbers" }, body: [
      { table: { head: [["", ""], ["Järjestysluku", "Ordinal"], ["", ""], ["Järjestysluku", "Ordinal"]], rows: [
        ["1.", "ensimmäinen", "7.", "seitsemäs"], ["2.", "toinen", "8.", "kahdeksas"], ["3.", "kolmas", "9.", "yhdeksäs"], ["4.", "neljäs", "10.", "kymmenes"],
        ["5.", "viides", "11.", "yhdes*toista*"], ["6.", "kuudes", "12.", "kahdes*toista*"], ["20.", "kahdeskymmenes", "21.", "kahdeskymmenesensimmäinen"],
        ["30.", "kolmaskymmenes", "31.", "kolmaskymmenesensimmäinen"]
      ], note: { fi: "Useimmat järjestysluvut loppuvat -s. Kirjoitettuna luvun perään tulee piste: 5. = viides.", en: "Most ordinals end in -s. In writing, add a full stop after the digit: 5. = viides." } } },
      { box: { fi: "1. ja 2. ovat erikoisia: ensimmäinen, toinen. Kaikki muut tehdään luvusta: kolme → kolmas, neljä → neljäs.", en: "1st and 2nd are irregular; the rest come from the cardinal number." }, kind: "muista" }
    ]},
    { title: { fi: "Päivämäärä", en: "Dates" }, body: [
      { p: { fi: "Päivä on järjestysluku, ja kuukausi on partitiivissa.", en: "The day is an ordinal number and the month is in the partitive." } },
      { table: { head: [["Kirjoitettu", "Written"], ["Sanottu", "Spoken"]], rows: [
        ["5.10.", "viides lokakuu*ta*"], ["1.5.", "ensimmäinen toukokuu*ta*"], ["6.12.", "kuudes joulukuu*ta*"], ["24.12.", "kahdeskymmenesneljäs joulukuu*ta*"]
      ]}},
      { ex: [["Monesko päivä tänään on? – Tänään on viides lokakuuta.", "What's the date today? – It's the fifth of October."], ["Syntymäpäiväni on kahdestoista kesäkuuta.", "My birthday is the twelfth of June."], ["Muutin Suomeen vuonna 2024.", "I moved to Finland in 2024."]] },
      { box: { fi: "Suomessa päivä tulee ensin: 5.10.2026 = 5. lokakuuta 2026.", en: "In Finland the day comes first: 5.10.2026 = 5 October 2026." }, kind: "huom" },
      { box: { fi: "Milloin? – viidentenä lokakuuta. Tämä muoto opitaan kirjassa 2.", en: "“On the fifth of October” (viidentenä lokakuuta) comes in Book 2." }, kind: "huom" }

    { title: { fi: "Postpositiot", en: "Postpositions" }, body: [
      { p: { fi: "Postpositio tulee sanan jälkeen. Sana on genetiivissä.", en: "A postposition comes after the word, which is in the genitive." } },
      { table: { head: [["Postpositio", "Postposition"], ["Esimerkki", "Example"], ["Englanti", "English"]], rows: [

      { box: { fi: "✗ Kissa on alla pöytä. → ✓ Kissa on ==pöydän alla==. Suomessa paikka-sana tulee jälkeen.", en: "Finnish puts the position word after the noun." }, kind: "virhe" }

/* ---------- text helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function md(s) {
  return esc(s)
    .replace(/==(.+?)==/g, '<strong class="hl">$1</strong>')
    .replace(/\*([^*\n]+?)\*/g, '<span class="m c">$1</span>')
    .replace(/\^([^^\n]+?)\^/g, '<span class="m p">$1</span>')
    .replace(/~([^~\n]+?)~/g, '<span class="g">$1</span>');
}
const plain = s => String(s == null ? "" : s).replace(/==|[*^~]/g, "");
const bi = (o, tag) => {
  tag = tag || "span";
  if (o == null) return "";
  if (typeof o === "string") return `<${tag} class="fi">${md(o)}</${tag}>`;
  return `<${tag} class="fi">${md(o.fi)}</${tag}>` + (o.en ? `<${tag} class="en">${md(o.en)}</${tag}>` : "");
};
const fiOf = o => (o == null ? "" : typeof o === "string" ? o : o.fi);
const enOf = o => (o == null ? "" : typeof o === "string" ? "" : o.en || "");
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const wc = s => (s.trim().match(/\S+/g) || []).length;

/* ---------- YKI timer ---------- */
function ykStart(btn) {
  const card = btn.closest("[data-yk]"), tm = $("[data-tm]", card), ph = $("[data-ph]", card), au = $("[data-audio]", card);
  if (card._iv) { clearInterval(card._iv); card._iv = 0; stopRec(card); btn.innerHTML = I.play + " Aloita · Start"; ph.textContent = "Keskeytetty · Stopped"; tm.classList.remove("speak"); return; }
  let prep = +btn.dataset.prep, time = +btn.dataset.time, mode = "prep", left = prep;
  btn.innerHTML = I.stop + " Lopeta · Stop"; tm.textContent = fmt(left); ph.textContent = "Valmistaudu · Prepare"; au.innerHTML = "";
  card._iv = setInterval(() => {
    left--;
    if (left <= 0 && mode === "prep") { mode = "speak"; left = time; ph.textContent = "Puhu nyt · Speak now"; tm.classList.add("speak"); if ($("[data-rec]", card) && $("[data-rec]", card).checked) startRec(card); }
    else if (left <= 0 && mode === "speak") { clearInterval(card._iv); card._iv = 0; ph.textContent = "Valmis · Done"; tm.classList.remove("speak"); btn.innerHTML = I.play + " Uudelleen · Again"; stopRec(card); left = 0; }
    tm.textContent = fmt(Math.max(0, left));
  }, 1000);
  onLeave(() => { clearInterval(card._iv); stopRec(card); });
}
async function startRec(card) {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const r = new MediaRecorder(st), ch = [];
    r.ondataavailable = e => ch.push(e.data);
    r.onstop = () => { st.getTracks().forEach(t => t.stop()); const u = URL.createObjectURL(new Blob(ch, { type: r.mimeType || "audio/webm" })); const au = $("[data-audio]", card); if (au) au.innerHTML = `<audio controls src="${u}" style="width:100%"></audio><div class="muted" style="font-size:13px">Tallenne on vain tässä ikkunassa. · The recording stays on this page only.</div>`; };
    r.start(); card._rec = r;
  } catch (e) { toast("Mikrofoni ei ole käytössä · Microphone not available"); }
}
function stopRec(card) { if (card._rec && card._rec.state !== "inactive") card._rec.stop(); card._rec = null; }

  if (c) setCrumb([{ t: "Kirja 1", h: "#/m/1" }, { t: "Kappale " + c.n, h: "#/m/1/" + c.id + "/sanasto" }, { t: "Kortit" }]);

  const unknownFirst = deck.filter(w => !S.known[wkey(w.c, w.fi)]);

function drawCard(st) {

    box.innerHTML = `<div class="card result"><div class="big">✓</div><h2 style="margin-top:10px">Pakka käyty läpi</h2><p class="en">Deck finished — ${st.done} marked as known this round.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcagain">Uusi kierros · New round</button></div></div>`;
    return;
  }

}

/* ---------- practice engine ---------- */
const N = s => String(s == null ? "" : s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"“”«»()]/g, " ").replace(/\s+/g, " ").trim();
const FOLD = s => s.replace(/ä/g, "a").replace(/ö/g, "o").replace(/å/g, "a");
function grade(input, ans) {
  const list = Array.isArray(ans) ? ans : [ans];
  const ni = N(input);
  for (const a of list) if (N(plain(a)) === ni) return { ok: true, near: false, best: plain(a) };
  for (const a of list) if (FOLD(N(plain(a))) === FOLD(ni) && ni) return { ok: true, near: true, best: plain(a) };
  return { ok: false, best: plain(list[0]) };
}
let P = null;
function vPractice(c, items, meta) {
  setCrumb([{ t: "Kirja 1", h: "#/m/1" }, { t: "Kappale " + c.n, h: meta.back }, { t: meta.kind === "test" ? "Testi" : "Harjoitus" }]);
  const its = meta.kind === "test" ? items.slice() : items.slice();
  P = { c, meta, items: its.map(x => Object.assign({}, x)), i: 0, ok: 0, miss: [], answered: false };
  AFTER = drawQ;
  return `<div class="wrap"><div class="pr" id="pr"></div></div>`;
}
function drawQ() {
  const box = $("#pr"); if (!box || !P) return;
  const { items, i, meta } = P;
  if (i >= items.length) return drawResult();
  const it = items[i];
  P.answered = false;
  const pct = Math.round((i / items.length) * 100);
  const top = `<div class="prtop"><a class="iconbtn" href="${meta.back}" aria-label="Lopeta · Quit">✕</a><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="cnt">${i + 1} / ${items.length}</span></div>`;
  const instr = it.instr || meta.instr || null;
  P.peeked = false;
  let body = "";
  const tlab = `<div class="instr">${instr ? md(fiOf(instr)) + (enOf(instr) ? ` <span class="en">· ${md(enOf(instr))}</span>` : "") : TYPELAB[it.t] || ""}</div>`;
  if (it.t === "fill") {
    const q = esc(plain(it.q)).replace("___", '<span class="blank"></span>');
    body = `${tlab}<div class="qt">${q}${it.h ? ` <span class="hintc">${esc(it.h)}</span>` : ""}</div>${it.en && it.showEn ? `<div class="en">${esc(it.en)}</div>` : ""}
    <form class="ans" data-form><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Vastaus · Answer"><button class="btn pri" type="submit">Tarkista</button></form>
    <div class="kbd"><button type="button" data-ins="ä">ä</button><button type="button" data-ins="ö">ö</button></div>`;
  } else if (it.t === "listen") {
    body = `${tlab}<div class="listen">${spkBtn(it.say, "Kuuntele lause · Play the sentence")}</div><div class="muted" style="text-align:center;font-size:13px">Kuuntele ja kirjoita mitä kuulet. · Listen and type what you hear.</div>
    <form class="ans" data-form><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Vastaus · Answer"><button class="btn pri" type="submit">Tarkista</button></form>
    <div class="kbd"><button type="button" data-ins="ä">ä</button><button type="button" data-ins="ö">ö</button><button type="button" class="btn sm ghost" data-act="showtxt" style="width:auto">Näytä teksti · Show text</button></div>`;
  } else if (it.t === "mc") {
    const o = shuffle(it.opts.map((x, k) => ({ x, k })));
    body = `${tlab}<div class="qt">${md(plain(it.q).replace("___", "_____"))}</div>${it.en && it.showEn ? `<div class="en">${esc(it.en)}</div>` : ""}<div class="opts">${o.map(z => `<button class="opt" data-act="mc" data-k="${z.k}">${md(z.x)}</button>`).join("")}</div>`;
  } else if (it.t === "tf") {
    body = `${tlab}<div class="qt">${md(it.q)}</div>${it.en ? `<div class="en">${esc(it.en)}</div>` : ""}<div class="opts tf"><button class="opt" data-act="tfq" data-v="1">Oikein · True</button><button class="opt" data-act="tfq" data-v="0">Väärin · False</button></div>`;
  } else if (it.t === "order") {
    const om = it.s.match(/^(.*?)([.!?]?)$/), punct = om[2];
    const toks = om[1].replace(/,/g, "").split(" ");
    const first = toks[0], low = first.charAt(0).toLowerCase() + first.slice(1);
    if (first !== low && (it.alt || []).some(a => a.split(" ").slice(1).some(w => w.replace(/[.!?,]$/, "") === low))) toks[0] = low;
    let sh = shuffle(toks.map((w, k) => ({ w, k }))); let guard = 0;
    while (toks.length > 1 && sh.map(z => z.w).join(" ") === toks.join(" ") && guard++ < 10) sh = shuffle(sh);
    P.built = [];
    body = `${tlab}<div class="qt" style="font-size:17px">${esc(it.en || "")}</div><div class="built" id="built" aria-label="Lauseesi · Your sentence">${punct ? `<span class="punct" aria-hidden="true">${punct}</span>` : ""}</div><div class="pool" id="pool">${sh.map((z, j) => `<button class="tok" data-act="tok" data-j="${j}">${esc(z.w)}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn sm" data-act="tokclear">Tyhjennä · Clear</button><button class="btn pri" data-act="ordercheck" style="margin-left:auto">Tarkista</button></div>`;
  } else if (it.t === "match") {
    const L = shuffle(it.pairs.map((p, k) => ({ x: p[0], k }))), R = shuffle(it.pairs.map((p, k) => ({ x: p[1], k })));
    P.m = { sel: null, done: 0, err: 0 };
    body = `${tlab}<div class="mt"><div class="col">${L.map(z => `<button data-act="ml" data-k="${z.k}">${md(z.x)}</button>`).join("")}</div><div class="col">${R.map(z => `<button data-act="mr" data-k="${z.k}">${md(z.x)}</button>`).join("")}</div></div>`;
  }
  box.innerHTML = top + `<div class="card q">${body}<div id="fb" aria-live="polite"></div><div class="prnav" id="nav"></div></div>`;
  const inp = $("#inp"); if (inp) inp.focus({ preventScroll: true });
  if (it.t === "listen") setTimeout(() => { const b = $(".listen .spk"); if (b && document.body.contains(b)) TTS.speak(it.say); }, 300);
}
function feedback(ok, it, opts) {
  opts = opts || {};
  if (P.answered) return; P.answered = true;
  if (ok) P.ok++; else P.miss.push(it);
  const right = opts.right != null ? opts.right : "";
  const why = it.why ? `<span class="why">${md(fiOf(it.why))}${enOf(it.why) ? ` <span class="en">· ${md(enOf(it.why))}</span>` : ""}</span>` : "";
  const en = it.en && it.t !== "order" && it.t !== "tf" ? `<span class="en" style="display:block;margin-top:4px">${esc(it.en)}</span>` : "";
  $("#fb").innerHTML = ok
    ? `<div class="fb ok"><b>${opts.near ? "Melkein! ✓" : "Oikein! ✓"}</b>${opts.near ? ` Oikea kirjoitusasu · correct spelling: <b>${esc(right)}</b>` : right && it.t !== "mc" && it.t !== "tf" && it.t !== "match" ? " " + esc(right) : ""}${why}${en}</div>`
    : `<div class="fb bad"><b>Ei aivan.</b> ${right ? "Oikea vastaus · Correct: <b>" + md(right) + "</b>" : ""}${why}${en}</div>`;
  const last = P.i >= P.items.length - 1;
  $("#nav").innerHTML = `${right && it.t !== "match" ? spkBtn(it.say || right) : "<span></span>"}<button class="btn pri" data-act="next">${last ? "Tulokset · Results" : "Seuraava · Next"} ${I.arrow}</button>`;
  setTimeout(() => { const n = $("[data-act=next]"); if (n) n.focus({ preventScroll: true }); }, 30);
}
function fullSentence(it, ans) { return it.q ? plain(it.q).replace("___", ans) : ans; }
function drawResult() {
  const { items, ok, miss, meta, c } = P;
  const pct = Math.round((ok / items.length) * 100);
  const store = meta.kind === "test" ? S.tests : S.drills;
  const prev = store[meta.key];
  if (prev == null || pct > prev) store[meta.key] = pct;
  save();
  const msg = pct >= 90 ? "Erinomaista! · Excellent!" : pct >= 75 ? "Hyvä! · Good work!" : pct >= 60 ? "Hyvä alku · A good start" : "Kertaa ja yritä uudelleen · Review and try again";
  const missList = miss.length ? `<div class="miss"><h3 style="font-size:17px">Kertaa nämä · Review these</h3><ul>${miss.map(it => `<li>${md(it.t === "fill" ? fullSentence(it, Array.isArray(it.a) ? it.a[0] : it.a) : it.t === "listen" ? it.say : it.t === "order" ? it.s : it.t === "mc" ? plain(it.q).replace("___", plain(it.opts[it.a])) + (plain(it.q).includes("___") ? "" : " → " + plain(it.opts[it.a])) : it.t === "tf" ? plain(it.q) + " → " + (it.a ? "oikein" : "väärin") : "Yhdistä-tehtävä · matching")}</li>`).join("")}</ul></div>` : "";
  $("#pr").innerHTML = `<div class="card result"><span class="eyebrow">${esc(fiOf(meta.title))}</span><div class="big" style="margin-top:12px">${pct} %</div><p style="margin:8px 0 0">${ok} / ${items.length} · ${msg}</p>${prev != null ? `<p class="muted" style="font-size:14px">Aiempi paras · previous best: ${prev} %</p>` : ""}${missList}
  <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" data-act="retry">Uudelleen · Retry</button><a class="btn pri" href="${meta.back}">Valmis · Done</a></div></div>`;
}

  <div class="row"><a class="btn" href="#/sanat/kortit">${I.cards} Kertaa kaikki · Review all</a></div>
  <input id="bq" class="search" type="search" placeholder="Hae · Search (esim. talo, house)" aria-label="Hae sanoja · Search words">
  <div id="blist" style="margin-top:14px"></div>${footer()}</div>`;
}
function drawBank(q) {
  const nq = FOLD(N(q)); const all = allWords();
  const hit = nq ? all.filter(w => FOLD(N(plain(w.fi))).includes(nq) || N(w.en).includes(N(q))) : all;
  $("#bcount").textContent = `${hit.length} sanaa${nq ? " · haku: " + q : ""} · ${hit.length} words`;
  const by = {};
  for (const w of hit) (by[w.c.id] = by[w.c.id] || []).push(w);
  const shown = hit.length > 400 ? 400 : hit.length;
  let n = 0;
  $("#blist").innerHTML = hit.length ? Object.keys(by).map(id => {
    const c = chap(id);
    const rows = by[id].filter(() => n++ < shown);
    if (!rows.length) return "";
    return `<div class="vg"><h3><a href="#/m/1/${id}/sanasto" style="color:inherit">Kappale ${c.n} · ${esc(fiOf(c.title))}</a></h3><div class="card">${rows.map(w => `<div class="vw${S.known[wkey(c, w.fi)] ? " known" : ""}">${spkBtn(w.fi)}<span class="w">${md(w.fi)}${w.note ? `<small>${esc(w.note)}</small>` : ""}</span><span class="e">${esc(w.en)}</span></div>`).join("")}</div></div>`;
  }).join("") + (hit.length > shown ? `<p class="muted">Näytetään ${shown} / ${hit.length}. Tarkenna hakua. · Showing ${shown} of ${hit.length} — narrow the search.</p>` : "") : `<div class="empty">Ei osumia. · No matches.</div>`;
}
function vSettings() {
  setCrumb([{ t: "Asetukset" }]);
  const vs = TTS.voices;
  return `<div class="wrap"><header class="phead"><h1>Asetukset</h1><p class="en">Settings</p></header><div class="set">
  <div class="card seti"><span><b>Teema</b><span class="en" style="display:block">Theme</span></span><div class="seg" role="group" aria-label="Teema">${[["auto", "Auto"], ["light", "Vaalea"], ["dark", "Tumma"]].map(([k, l]) => `<button data-act="theme" data-v="${k}" class="${S.theme === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
  <div class="card seti"><span><b>Englanninkieliset käännökset</b><span class="muted" style="display:block;font-size:14px">English translations</span></span><div class="seg" role="group" aria-label="Englanti">${[[1, "Näytä · Show"], [0, "Piilota · Hide"]].map(([k, l]) => `<button data-act="en" data-v="${k}" class="${(S.en ? 1 : 0) === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
  <div class="card seti"><span><b>Puhenopeus</b><span class="en" style="display:block">Speech rate · <span id="rv">${S.rate.toFixed(2)}</span></span></span><span class="row"><input type="range" min="0.5" max="1.3" step="0.05" value="${S.rate}" data-act="rate" aria-label="Puhenopeus · Speech rate"><button class="btn sm" data-say="Hei! Tervetuloa kurssille. Mitä kuuluu?">${I.spk} Testaa</button></span></div>
  <div class="card seti"><span><b>Ääni</b><span class="en" style="display:block">Finnish voice${vs.length ? "" : " — none found on this device. Install a Finnish voice in your system settings for read-aloud and dictation."}</span></span>${vs.length ? `<select data-act="voice" aria-label="Ääni · Voice">${vs.map(v => `<option${v.name === S.voice ? " selected" : ""}>${esc(v.name)}</option>`).join("")}</select>` : `<span class="tag soon">Ei ääntä</span>`}</div>
  <div class="card seti"><span><b>Varmuuskopio</b><span class="en" style="display:block">Back up or restore your progress</span></span><span class="row"><button class="btn sm" data-act="export">Lataa · Export</button><label class="btn sm" style="cursor:pointer">Palauta · Import<input type="file" accept="application/json,.json" data-act="import" hidden></label></span></div>
  <div class="card seti"><span><b>Nollaa edistyminen</b><span class="en" style="display:block">Reset all progress on this device</span></span><button class="btn sm" data-act="reset" style="color:var(--lingon)">Nollaa · Reset</button></div>
  </div>${footer()}</div>`;
}
function vNotFound() {
  setCrumb([]);
  return `<div class="wrap"><div class="empty" style="padding:60px 0"><h1 style="font-size:30px">Sivua ei löytynyt</h1><p>Page not found.</p><a class="btn pri" href="#/">Etusivu · Home</a></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const say = e.target.closest("[data-say]");
  if (say) { e.preventDefault(); say.classList.add("on"); TTS.speak(say.dataset.say, () => say.classList.remove("on")); return; }
  const ins = e.target.closest("[data-ins]");
  if (ins) { const i = $("#inp"); if (i) { const s = i.selectionStart ?? i.value.length, en = i.selectionEnd ?? s; i.value = i.value.slice(0, s) + ins.dataset.ins + i.value.slice(en); i.focus(); i.setSelectionRange(s + 1, s + 1); } return; }
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "playall") return playAll(a);
  if (act === "entoggle") { a.closest("section").classList.toggle("enflip"); return; }
  if (act === "tf") {
    const q = a.closest(".tfq"), r = $(".tfr", q), ok = a.dataset.v === q.dataset.a;
    r.innerHTML = ok ? `<b style="color:var(--ok)">✓ Oikein</b>` : `<b style="color:var(--lingon)">✗ Ei — vastaus on ${q.dataset.a === "1" ? "oikein" : "väärin"}</b>`; return;
  }
  if (act === "ykstart") return ykStart(a);
  if (act === "theme") { S.theme = a.dataset.v; save(); applyPrefs(); route(); return; }
  if (act === "en") { S.en = a.dataset.v === "1"; save(); applyPrefs(); route(); return; }
  if (act === "export") {
    const b = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }), u = URL.createObjectURL(b), l = document.createElement("a");
    l.href = u; l.download = "askel-edistyminen.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); return;
  }
  if (act === "reset") { if (confirm("Nollataanko kaikki edistyminen? · Reset all progress?")) { const keep = { theme: S.theme, en: S.en, rate: S.rate, voice: S.voice }; S = Object.assign(DEF(), keep); save(); toast("Nollattu · Reset done"); route(); } return; }
  /* flashcards */
  const fc = $("#fc"), st = fc && fc._st;
  if (act === "fcflip") { a.classList.toggle("flip"); return; }
  if (act === "fcdir" && st) { st.rev = a.dataset.v === "1"; $$("[data-act=fcdir]").forEach(b => b.classList.toggle("on", b === a)); drawCard(st); return; }
  if (act === "fcknow" && st) { const w = st.deck[st.i]; S.known[wkey(w.c, w.fi)] = 1; save(); st.done++; st.i++; drawCard(st); return; }
  if (act === "fcagainone" && st) { const w = st.deck[st.i]; st.deck.push(w); st.i++; drawCard(st); return; }
  if (act === "fcagain" && st) { const rest = st.deck.filter(w => !S.known[wkey(w.c, w.fi)]); const uniq = [...new Map(rest.map(w => [wkey(w.c, w.fi), w])).values()]; st.deck = shuffle(uniq.length ? uniq : st.deck.filter((w, i, arr) => arr.findIndex(z => z.fi === w.fi && z.c === w.c) === i)); st.i = 0; st.done = 0; drawCard(st); return; }
  /* practice */
  if (!P) return;
  const it = P.items[P.i];
  if (act === "next") { P.i++; drawQ(); return; }
  if (act === "retry") { P.i = 0; P.ok = 0; P.miss = []; drawQ(); return; }
  if (act === "showtxt") { const fb = $("#fb"); if (fb && !P.answered) fb.innerHTML = `<div class="fb ok" style="background:var(--card2)">${esc(it.say)}</div>`; P.peeked = true; return; }
  if (act === "mc" && !P.answered) {
    const k = +a.dataset.k, ok = k === it.a;
    $$(".opt").forEach(b => { b.disabled = true; if (+b.dataset.k === it.a) b.classList.add("ok"); });
    if (!ok) a.classList.add("bad");
    feedback(ok, it, { right: plain(it.q).includes("___") ? fullSentence(it, plain(it.opts[it.a])) : plain(it.opts[it.a]) }); return;
  }
  if (act === "tfq" && !P.answered) {
    const ok = (a.dataset.v === "1") === !!it.a;
    $$(".opt").forEach(b => { b.disabled = true; if ((b.dataset.v === "1") === !!it.a) b.classList.add("ok"); });
    if (!ok) a.classList.add("bad");
    feedback(ok, it, { right: it.a ? "Oikein · True" : "Väärin · False" }); return;
  }
  if (act === "tok" && !P.answered) { a.classList.add("used"); const b = document.createElement("button"); b.className = "tok"; b.dataset.act = "untok"; b.dataset.j = a.dataset.j; b.textContent = a.textContent; const bu = $("#built"); bu.insertBefore(b, $(".punct", bu)); return; }
  if (act === "untok" && !P.answered) { const src = $(`#pool [data-j="${a.dataset.j}"]`); if (src) src.classList.remove("used"); a.remove(); return; }
  if (act === "tokclear" && !P.answered) { $$("#built .tok").forEach(b => b.remove()); $$("#pool .tok").forEach(b => b.classList.remove("used")); return; }
  if (act === "ordercheck" && !P.answered) {
    const s = $$("#built .tok").map(b => b.textContent).join(" ");
    if (!s) { toast("Valitse sanat · Tap the words first"); return; }
    const g = grade(s, [it.s].concat(it.alt || []));
    $$(".tok").forEach(b => b.disabled = true);
    feedback(g.ok, it, { right: it.s }); return;
  }
  if ((act === "ml" || act === "mr") && !P.answered) {
    if (a.classList.contains("done")) return;
    const side = act, m = P.m;
    if (!m.sel || m.sel.side === side) { $$(`.mt [data-act=${side}]`).forEach(b => b.classList.remove("sel", "bad")); a.classList.add("sel"); m.sel = { side, k: a.dataset.k, el: a }; return; }
    if (m.sel.k === a.dataset.k) { m.sel.el.classList.remove("sel"); m.sel.el.classList.add("done"); a.classList.add("done"); m.done++; m.sel = null; if (m.done === it.pairs.length) feedback(m.err <= 1, it, { right: m.err ? `${m.err} virhe · mistake` : "" }); }
    else { m.err++; a.classList.add("bad"); const prev = m.sel.el; setTimeout(() => { a.classList.remove("bad"); prev.classList.remove("sel"); }, 450); m.sel = null; }
    return;
  }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  if (!P) return;
  const it = P.items[P.i], inp = $("#inp");
  if (P.answered) { P.i++; drawQ(); return; }
  if (!inp.value.trim()) { toast("Kirjoita vastaus · Type an answer"); return; }
  const ans = it.t === "listen" ? [it.say].concat(it.alt || []) : it.a;
  const g = grade(inp.value, ans);
  inp.classList.add(g.ok ? "ok" : "bad"); inp.readOnly = true;
  const right = it.t === "listen" ? plain(it.say) : fullSentence(it, g.best);
  const ok = g.ok && !P.peeked;
  P.peeked = false;
  feedback(ok, Object.assign({}, it, { say: it.t === "listen" ? it.say : fullSentence(it, g.best) }), { near: g.ok && g.near, right });
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".fc")) { e.preventDefault(); e.target.classList.toggle("flip"); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("[data-write]")) {
    S.write[t.dataset.write] = t.value.slice(0, 20000); save();
    const c = chap(t.dataset.write), w = $("[data-wc]"); if (w && c) w.textContent = `${wc(t.value)} / ${c.yki.write.words} sanaa · words`;
  }
  if (t.matches("[data-act=rate]")) { S.rate = +t.value; save(); const r = $("#rv"); if (r) r.textContent = S.rate.toFixed(2); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-act=voice]")) { S.voice = t.value; save(); TTS.speak("Hei, minä puhun suomea."); }
  if (t.matches("[data-act=import]") && t.files && t.files[0]) {
    const f = t.files[0];
    if (f.size > 2e6) { toast("Tiedosto on liian suuri · File too large"); return; }
    const r = new FileReader();
    r.onload = () => { try { const x = JSON.parse(r.result); if (!x || typeof x !== "object" || x.v !== 1) throw 0; S = sane(x); save(); applyPrefs(); toast("Palautettu · Restored"); route(); } catch (err) { toast("Virheellinen tiedosto · Not a valid backup"); } };
    r.readAsText(f);
  }
});

  document.body.insertAdjacentHTML("afterbegin", "");
  $("#brandlogo").innerHTML = I.logo;
  $("#setbtn").innerHTML = I.gear;
  $("#homebtn").innerHTML = I.home;
  applyPrefs();
  window.addEventListener("hashchange", route);
  route();
}
boot();
